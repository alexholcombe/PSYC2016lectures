<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Colour Selection Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Dot canvases -->
  <canvas id="leftCanvas" class="dot-canvas left-canvas"></canvas>
  <canvas id="rightCanvas" class="dot-canvas right-canvas"></canvas>

  <!-- Centre column with cross‑hairs -->
  <div class="center-column">
    <div class="crosshair horizontal"></div>
    <div class="crosshair vertical"></div>
  </div>

  <!-- Bottom control bar -->
  <div class="control-bar">
    <div class="slider-row">
      <label>Number of Dots
        <input type="range" id="numDots" min="100" max="1000" value="900" />
        <span id="numDotsVal">900</span>
      </label>
      <label>Alpha (opacity)
        <input type="range" id="alpha" min="0" max="1" step="0.01" value="1" />
        <span id="alphaVal">1</span>
      </label>
    </div>
    <div class="slider-row">
      <label>Red intensity (R)
        <input type="range" id="redLevel" min="50" max="255" value="200" />
        <span id="redLevelVal">200</span>
      </label>
      <label>Blue intensity (B)
        <input type="range" id="blueLevel" min="50" max="255" value="200" />
        <span id="blueLevelVal">200</span>
      </label>
    </div>
    <div class="slider-row">
        <label>Refresh rate (Hz)
          <input type="range" id="refreshRate" min="0" max="20" step="0.1" value="0" />
          <span id="refreshRateVal">0</span>
        </label>
      <label>Dot radius (px)
        <input type="range" id="radius" min="1" max="30" value="9" />
        <span id="radiusVal">9</span>
      </label>
    </div>
    <div class="slider-row">
      <label>Centre column width (px)
        <input type="range" id="columnWidth" min="20" max="300" value="30" />
        <span id="columnWidthVal">30</span>
      </label>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
